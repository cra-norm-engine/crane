services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cra_compliance}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cra_compliance}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  migrate:
    image: ${BACKEND_IMAGE:-ghcr.io/cra-norm-engine/crane-backend:latest}
    profiles: ["tools"]
    env_file: [.env]
    environment:
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL}
      BACKEND_AUTO_MIGRATE: "false"
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  backup-verify:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      POSTGRES_DB: crane_restore_verify
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: restore-verification-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crane_restore_verify"]
      interval: 2s
      timeout: 2s
      retries: 30

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/cra-norm-engine/crane-backend:latest}
    restart: unless-stopped
    env_file: [.env]
    environment:
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL}
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      BACKEND_AUTO_MIGRATE: "false"
      BACKEND_DEBUG: "false"
      BACKEND_ENVIRONMENT: production
      BACKEND_APP_VERSION: ${CRANE_VERSION:-0.0.0-dev}
      BACKEND_UPDATE_STATE_DIR: /var/lib/crane/updates
      BACKEND_UPDATE_PUBLIC_KEY_PATH: /etc/crane/update-public.pem
    volumes:
      - ./data/artifacts:/workspace/backend/uploads/artifacts
      - ./data/updates:/var/lib/crane/updates
      - ./updates/update-public.pem:/etc/crane/update-public.pem:ro
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/cra-norm-engine/crane-frontend:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 20s
      timeout: 5s
      retries: 6
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M

volumes:
  postgres_data:
