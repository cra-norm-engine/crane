name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: |
            ghcr.io/cra-norm-engine/crane-${{ matrix.component }}:${{ github.ref_name }}
            ghcr.io/cra-norm-engine/crane-${{ matrix.component }}:latest
          build-args: VITE_APP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ghcr.io/cra-norm-engine/crane-${{ matrix.component }}@${{ steps.build.outputs.digest }}
      - run: printf '%s' '${{ steps.build.outputs.digest }}' > '${{ matrix.component }}.digest'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}
          path: ${{ matrix.component }}.digest

  release:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - name: Require update signing key
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: test -n "$UPDATE_KEY" || { echo 'Configure UPDATE_SIGNING_PRIVATE_KEY_B64'; exit 1; }
      - name: Generate signed update manifest
        env:
          UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_B64 }}
        run: |
          python3 .github/scripts/release_manifest.py \
            --version "${GITHUB_REF_NAME}" \
            --backend-digest "$(cat backend.digest)" \
            --frontend-digest "$(cat frontend.digest)" \
            --repository "${GITHUB_REPOSITORY}"
          printf '%s' "$UPDATE_KEY" | base64 --decode > /tmp/update-private.pem
          chmod 600 /tmp/update-private.pem
          openssl pkeyutl -sign -rawin -inkey /tmp/update-private.pem -in update-manifest.json -out /tmp/update-manifest.sig
          base64 -w0 /tmp/update-manifest.sig > update-manifest.json.sig
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            update-manifest.json
            update-manifest.json.sig
